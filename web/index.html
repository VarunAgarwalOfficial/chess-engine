<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="board-wrap">
        <div id="board" class="board" role="grid" aria-label="Chess board"></div>
      </div>

      <aside class="panel">
        <h1>Chess</h1>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <p id="engine-info" class="engine-info"></p>

        <div class="controls">
          <label>
            You play
            <select id="side">
              <option value="white">White</option>
              <option value="black">Black</option>
              <option value="both">Both sides</option>
            </select>
          </label>
          <label>
            Engine time
            <select id="time">
              <option value="300">0.3 s</option>
              <option value="1000" selected>1 s</option>
              <option value="3000">3 s</option>
            </select>
          </label>
        </div>
        <div class="buttons">
          <button id="new" type="button">New game</button>
          <button id="undo" type="button">Undo</button>
          <button id="flip" type="button">Flip board</button>
        </div>

        <h2>Moves</h2>
        <ol id="moves" class="moves"></ol>

        <h2>Position</h2>
        <form id="fen-form" class="fen">
          <input id="fen" type="text" spellcheck="false" autocomplete="off" aria-label="FEN" />
          <button type="submit">Load</button>
        </form>
        <p id="fen-error" class="error" role="alert"></p>
      </aside>
    </main>

    <dialog id="promotion" aria-label="Promote to">
      <form method="dialog" class="promotion-choices"></form>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
